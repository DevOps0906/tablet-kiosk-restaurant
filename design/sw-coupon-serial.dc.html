<!doctype html>
<html lang="ko">

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F4F8F7;color:#12201D;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:80px;flex:none;box-sizing:border-box;padding:0 24px;background:#FFFFFF;border-bottom:1px solid #D5E2DE;display:flex;align-items:center;gap:16px">
<a href="sw-03-pay.dc.html" style="height:52px;box-sizing:border-box;padding:0 20px;border:1px solid #D5E2DE;border-radius:26px;font-size:18px;color:#12201D;text-decoration:none;display:flex;align-items:center">‹ 결제로</a>
<span style="font-size:30px;font-weight:900">쿠폰 사용</span>
<div role="tablist" aria-label="쿠폰 입력 방법" style="margin-left:20px;width:440px;height:56px;box-sizing:border-box;padding:4px;border-radius:16px;background:#E3ECE9;display:flex;gap:4px">

<a role="tab" aria-selected="false" href="sw-coupon-scan.dc.html" style="flex:1;border-radius:12px;color:#4A5B57;font-size:18px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">바코드 · QR 스캔</a>

</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:24px;display:flex;gap:24px">

<span style="font-size:20px;font-weight:700">쿠폰에 적힌 12자리를 입력해 주세요 <span style="font-size:15px;font-weight:400;color:#4A5B57">0 · O · 1 · I는 쓰지 않아요</span></span>
<div style="display:flex;align-items:center;gap:12px" aria-label="입력한 시리얼 번호">
<span style="flex:1;height:76px;box-sizing:border-box;border:3px solid #007A64;border-radius:16px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;letter-spacing:4px;display:flex;align-items:center;justify-content:center">GB24</span>
<span style="font-size:28px;color:#9BB0AB">-</span>
<span style="flex:1;height:76px;box-sizing:border-box;border:3px solid #007A64;border-radius:16px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;letter-spacing:4px;display:flex;align-items:center;justify-content:center">7KQ9</span>
<span style="font-size:28px;color:#9BB0AB">-</span>
<span style="flex:1;height:76px;box-sizing:border-box;border:3px solid #007A64;border-radius:16px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;letter-spacing:4px;display:flex;align-items:center;justify-content:center">M2XD</span>
</div>
<div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="32">
<button style="height:62px;border:1px solid #D5E2DE;border-radius:12px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;color:#12201D">{{k}}</button>
</sc-for>
</div>
<div style="display:flex;gap:8px">
<button style="flex:1;height:58px;border:1px solid #D5E2DE;border-radius:12px;background:#E3ECE9;font-family:inherit;font-size:18px;font-weight:700;color:#12201D">전체 지움</button>
<button aria-label="한 글자 지움" style="flex:1;height:58px;border:1px solid #D5E2DE;border-radius:12px;background:#E3ECE9;font-family:inherit;font-size:22px;font-weight:700;color:#12201D">⌫</button>
</div>
</div>

<div style="width:400px;flex:none;box-sizing:border-box;background:#FFFFFF;border:2px solid #007A64;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px"><span style="width:36px;height:36px;flex:none;border-radius:18px;background:#007A64;color:#FFFFFF;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center">✓</span><span style="font-size:20px;font-weight:900">쿠폰 확인됨</span></div>
<span style="font-size:22px;font-weight:900">첫 방문 감사 5,000원 할인</span>
<span style="font-size:16px;line-height:24px;color:#4A5B57">5만원 이상 주문 · 11월 30일까지 · 1회 사용</span>
<div style="height:1px;background:#E3ECE9"></div>
<div style="display:flex;justify-content:space-between;font-size:19px"><span style="color:#4A5B57">주문 금액</span><span style="font-family:'JetBrains Mono',monospace">72,000원</span></div>
<div style="display:flex;justify-content:space-between;font-size:19px"><span style="color:#4A5B57">쿠폰 할인</span><span style="font-family:'JetBrains Mono',monospace;color:#C81E3F">-5,000원</span></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:21px;font-weight:700">결제할 금액</span><span style="font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:700;color:#007A64">67,000원</span></div>
<div style="flex:1"></div>
<a href="sw-03-pay.dc.html" style="height:72px;box-sizing:border-box;border-radius:18px;background:#007A64;color:#FFFFFF;font-size:21px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">적용하고 결제 방법 선택</a>
<a href="sw-03-pay.dc.html" style="height:56px;box-sizing:border-box;border:2px solid #D5E2DE;border-radius:16px;color:#12201D;font-size:19px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">취소</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { keys: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'.split('') };
  }
}
</script>
</body>
</html>
