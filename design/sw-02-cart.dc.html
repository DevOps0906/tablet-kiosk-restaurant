<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소프트웨어형 주문 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F4F8F7;color:#12201D;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:80px;flex:none;box-sizing:border-box;padding:0 24px;background:#FFFFFF;border-bottom:1px solid #D5E2DE;display:flex;align-items:center;gap:16px">
<a href="sw-01-menu.dc.html" style="height:52px;box-sizing:border-box;padding:0 20px;border:1px solid #D5E2DE;border-radius:26px;font-size:18px;color:#12201D;text-decoration:none;display:flex;align-items:center">‹ 메뉴로</a>
<span style="font-size:30px;font-weight:900">주문 확인</span>
<span style="height:38px;padding:0 14px;border-radius:12px;background:#007A64;color:#FFFFFF;font-size:19px;font-weight:700;display:flex;align-items:center">매장</span>
<span style="flex:1"></span>
<span style="font-size:17px;color:#4A5B57">[가게 이름] 숯불갈비</span>
</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:24px;display:flex;gap:24px">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:20px;color:#4A5B57">메뉴 4종 · 8개</span><button style="height:44px;padding:0 16px;border:0;background:transparent;font-family:inherit;font-size:18px;color:#C81E3F">전체 삭제</button></div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<div style="height:116px;box-sizing:border-box;background:#FFFFFF;border:1px solid #D5E2DE;border-radius:18px;padding:0 20px;display:flex;align-items:center;gap:18px">
<span style="width:80px;height:80px;flex:none;border-radius:14px;background:{{l.tint}}"></span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="font-size:22px;font-weight:700">{{l.name}}</span><span style="font-size:16px;color:#4A5B57">{{l.note}}</span></div>
<div style="display:flex;align-items:center;gap:10px">
<button aria-label="수량 줄이기" style="width:52px;height:52px;border:1px solid #D5E2DE;border-radius:12px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:24px;color:#12201D">−</button>
<span style="min-width:64px;text-align:center;font-size:20px;font-weight:700">{{l.qty}}</span>
<button aria-label="수량 늘리기" style="width:52px;height:52px;border:1px solid #D5E2DE;border-radius:12px;background:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:24px;color:#12201D">+</button>
</div>
<span style="width:130px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700">{{l.total}}원</span>
</div>
</sc-for>
</div>

<div style="width:380px;flex:none;box-sizing:border-box;background:#FFFFFF;border:1px solid #D5E2DE;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px">
<span style="font-size:22px;font-weight:700">결제 예정</span>
<div style="display:flex;justify-content:space-between;font-size:19px"><span style="color:#4A5B57">상품 금액</span><span style="font-family:'JetBrains Mono',monospace">72,000원</span></div>
<div style="display:flex;justify-content:space-between;font-size:19px"><span style="color:#4A5B57">할인</span><span style="font-family:'JetBrains Mono',monospace">0원</span></div>
<div style="height:1px;background:#D5E2DE"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:22px;font-weight:700">결제 금액</span><span style="font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;color:#007A64">72,000원</span></div>
<div style="box-sizing:border-box;border-radius:14px;background:#FEF3D7;padding:14px 16px;font-size:16px;line-height:24px;color:#7A4A00">냉면은 고기를 다 드신 뒤에 내드려요. 바로 원하시면 직원에게 말씀해 주세요.</div>
<div style="flex:1"></div>
<button style="height:64px;border:2px solid #007A64;border-radius:16px;background:#FFFFFF;color:#007A64;font-family:inherit;font-size:21px;font-weight:700">더 담기</button>
<a href="sw-03-pay.dc.html" style="height:72px;box-sizing:border-box;border-radius:18px;background:#007A64;color:#FFFFFF;font-size:23px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center">결제하기 ›</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lines: [
        { name: '돼지갈비', note: '1인분 250g', qty: '3인분', total: '48,000', tint: '#F4DCCB' },
        { name: '물냉면', note: '식사 · 고기 후 제공', qty: '2', total: '18,000', tint: '#E3EEF2' },
        { name: '된장찌개', note: '고기 주문 시', qty: '1', total: '4,000', tint: '#EFE3CF' },
        { name: '공깃밥', note: '1공기', qty: '2', total: '2,000', tint: '#F4F1EA' }
      ]
    };
  }
}
</script>
</body>
</html>
