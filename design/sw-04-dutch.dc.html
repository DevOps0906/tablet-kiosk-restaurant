<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소프트웨어형 더치페이</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#F4F8F7;color:#12201D;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<div style="height:80px;flex:none;box-sizing:border-box;padding:0 24px;background:#FFFFFF;border-bottom:1px solid #D5E2DE;display:flex;align-items:center;gap:16px">
<span style="font-size:30px;font-weight:900">더치페이</span>
<div style="margin-left:16px;display:flex;gap:8px">
<button style="height:52px;padding:0 22px;border:2px solid #D5E2DE;border-radius:14px;background:#FFFFFF;font-family:inherit;font-size:19px;color:#12201D">N등분</button>
<button aria-pressed="true" style="height:52px;padding:0 22px;border:0;border-radius:14px;background:#2563EB;color:#FFFFFF;font-family:inherit;font-size:19px;font-weight:700">인분 · 메뉴별</button>
<button style="height:52px;padding:0 22px;border:2px solid #D5E2DE;border-radius:14px;background:#FFFFFF;font-family:inherit;font-size:19px;color:#12201D">금액 입력</button>
</div>
<span style="flex:1"></span>
<button style="height:52px;padding:0 20px;border:1px solid #D5E2DE;border-radius:26px;background:#FFFFFF;font-family:inherit;font-size:18px;color:#12201D">직원 호출</button>
</div>

<div style="flex:1;min-height:0;box-sizing:border-box;padding:24px;display:flex;gap:24px">

<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px">
<span style="font-size:24px;font-weight:700">결제자 2님, 드신 만큼 골라 주세요 <span style="font-size:17px;font-weight:400;color:#4A5B57">고기는 1인분씩 나눠져 있어요</span></span>
<sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
<button aria-pressed="{{row.pressed}}" style="box-sizing:border-box;width:100%;height:76px;border:{{row.border}};border-radius:16px;background:{{row.bg}};padding:0 20px;display:flex;align-items:center;gap:18px;text-align:left;font-family:inherit;color:{{row.ink}}">
<span style="width:36px;height:36px;flex:none;box-sizing:border-box;border-radius:10px;border:{{row.boxBorder}};background:{{row.boxBg}};color:#FFFFFF;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center">{{row.check}}</span>
<span style="flex:1;font-size:21px;font-weight:700">{{row.name}}</span>
<span style="font-size:16px;color:#4A5B57">{{row.note}}</span>
<span style="width:120px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:700">{{row.price}}원</span>
</button>
</sc-for>
</div>

<div style="width:380px;flex:none;box-sizing:border-box;background:#FFFFFF;border:1px solid #D5E2DE;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;justify-content:space-between;font-size:18px"><span style="color:#4A5B57">전체</span><span style="font-family:'JetBrains Mono',monospace;font-weight:700">72,000원</span></div>
<div style="display:flex;justify-content:space-between;font-size:18px"><span style="color:#4A5B57">결제 완료</span><span style="font-family:'JetBrains Mono',monospace;font-weight:700;color:#007A64">16,000원</span></div>
<div style="display:flex;justify-content:space-between;font-size:18px"><span style="color:#4A5B57">남은 금액</span><span style="font-family:'JetBrains Mono',monospace;font-weight:700;color:#C81E3F">56,000원</span></div>
<div style="height:12px;border-radius:6px;background:#E3ECE9;overflow:hidden"><div style="width:22.2%;height:12px;background:#007A64"></div></div>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<span style="height:34px;padding:0 12px;border-radius:17px;background:#E3F7F2;color:#00473A;font-size:15px;font-weight:700;display:flex;align-items:center">결제자 1 · 완료</span>
<span style="height:34px;padding:0 12px;border-radius:17px;background:#2563EB;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center">결제자 2 · 진행 중</span>
<span style="height:34px;padding:0 12px;border-radius:17px;background:#EEF2F1;color:#4A5B57;font-size:15px;display:flex;align-items:center">결제자 3 · 대기</span>
</div>
<div style="flex:1"></div>
<span style="font-size:18px;color:#4A5B57">결제자 2 결제 금액</span>
<span style="font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:#2563EB">25,000원</span>
<button style="height:72px;border:0;border-radius:18px;background:#2563EB;color:#FFFFFF;font-family:inherit;font-size:23px;font-weight:700">25,000원 결제하기</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const src = [
      { name: '돼지갈비 1인분', note: '결제자 1 완료', price: '16,000', kind: 'paid' },
      { name: '돼지갈비 1인분', note: '3인분 중 2', price: '16,000', kind: 'picked' },
      { name: '돼지갈비 1인분', note: '3인분 중 3', price: '16,000', kind: 'open' },
      { name: '물냉면', note: '2그릇 중 1', price: '9,000', kind: 'picked' },
      { name: '물냉면', note: '2그릇 중 2', price: '9,000', kind: 'open' },
      { name: '된장찌개 · 공깃밥 2', note: '함께', price: '6,000', kind: 'open' }
    ];
    return {
      rows: src.map((s) => {
        const paid = s.kind === 'paid', picked = s.kind === 'picked';
        return {
          ...s, pressed: picked,
          check: picked || paid ? '✓' : '',
          border: picked ? '3px solid #2563EB' : '1px solid #D5E2DE',
          bg: paid ? '#EEF2F1' : picked ? '#E8EFFE' : '#FFFFFF',
          ink: paid ? '#4A5B57' : '#12201D',
          boxBorder: picked || paid ? '0' : '2px solid #9BB0AB',
          boxBg: picked ? '#2563EB' : paid ? '#007A64' : '#FFFFFF'
        };
      })
    };
  }
}
</script>
</body>
</html>
